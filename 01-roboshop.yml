- name: creating instances and update route records
  hosts: local
  connection: local
  vars:
    ami_id: ami-0220d79f3f480ecf5
    sg_id: sg-04ed9a90b34bd15be
    zone_id: Z010927213W8PEK90FFQB
    domain_id: anandsurya.online
    instances: 
      - mongodb

  tasks:
  - name: create instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: t3.micro
      security_groups:
        - "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the ec2_output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"

  - name: update route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_id }}"
      record: "{{ item.item }}.{{ domain_id }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
      